name: Overlay desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/overlay-desktop.yml']
  push:
    paths: ['desktop/**', '.github/workflows/overlay-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.12.0'
      # 桌面行为通过原生 API mock 验证，不下载 Electron 或安装 Web 依赖。
      - run: node --test desktop/desktop.test.cjs desktop/template-match.test.cjs desktop/countdown-trigger.test.cjs desktop/region-picker.test.cjs desktop/launcher.test.cjs
      - run: node --check desktop/preload.cjs
      - run: node --check desktop/editor-preload.cjs
      - run: node --check desktop/picker-preload.cjs
      - run: node --check desktop/region-picker.js

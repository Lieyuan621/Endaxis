name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: windows-latest
            node: '22.12.0'
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check application types
        run: npm run type-check
      - name: Check game data contract
        run: npm run type-check:game-data-contract
      - name: Check compiler types
        run: npm run type-check:game-data
      - name: Check tool types
        run: npm run type-check:tools
      - name: Test application
        run: npm test -- --maxWorkers=1
      - name: Test compiler
        run: npm run test:game-data -- --maxWorkers=1
      - name: Test tools
        run: npm run test:tools -- --maxWorkers=1
      - name: Build
        run: npm run build
